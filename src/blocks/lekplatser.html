<p>
  Fyra lekplatser ligger utspridda på gårdarna – vid Myggdalsvägen 10,
  40, 62 och 110 – med gungor, rutschkana, klätternät, fjädergungor,
  karusell, balansbana och sandlådor. Katter får inte gå lösa i
  föreningen, just för att sandlådorna ska gå att leka i.
</p>
