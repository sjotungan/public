<p>
  Åtta miljöhus ligger utspridda i området, med sortering för färgat och
  ofärgat glas, metall, plast och batterier. Matavfall lämnas i fyra kärl längs
  lokalgatan sedan insamlingen började i juni 2023.
</p>

<p>
  Tre grovsophus, öppna 06–19, tar emot tidningar, wellpapp, elektronik,
  ljuskällor och grovsopor.
</p>
