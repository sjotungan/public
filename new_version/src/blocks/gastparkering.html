<!--
title: Gästparkering
-->

<ul>
  <li>Föreningen har fyra avgiftsbelagda besöksparkeringar. Betalning sker med app.</li>
  <li>Platserna är endast avsedda för tillfälliga gäster, inte för regelbunden parkering.</li>
  <li>Även boende i Sjötungan får använda dem.</li>
  <li>Endast personbil, max 3,5 ton, i besiktigat, godkänt och kördugligt skick.</li>
</ul>
