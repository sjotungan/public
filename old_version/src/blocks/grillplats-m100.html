<!--
title: Grillplatsen vid Myggdalsvägen 100
-->

<p>
  Grillplatsen ligger på en stensatt yta intill husgaveln, med ett bord och två
  bänkar med ryggstöd i grånat trä och en papperskorg intill. Grillen är en
  svart kolgrill på ben, samma modell som vid nummer 68 och 102. En hög tujahäck
  skärmar av ytan mot gången bakom.
  <a href="https://www.google.com/maps/search/?api=1&amp;query=59.241378,18.236978">Visa på karta</a>.
</p>
