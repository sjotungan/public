<p>
  En av de tre tvättstugor som ligger i egna hus. Huset
  är en låg träbyggnad med sedumtak, och inne i det står två tvättmaskiner,
  torktumlare, torkskåp, mangel och en utslagsback. Klicka på en bild för att se
  den i full storlek och bläddra vidare bland de andra.
</p>
