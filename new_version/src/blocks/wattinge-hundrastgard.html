<p>
  Kommunens hundrastgård vid Wättinge gårdsväg, intill Dalhallen, ungefär en
  kvarts promenad bort – ett alternativ till föreningens egen när man ändå är
  ute och går.

  Reglerna för kommunens rastgårdar står på
  <a href="https://www.tyreso.se/uppleva--gora/natur-och-friluftsliv/hund-i-tyreso.html">Hund i Tyresö</a>.
</p>
