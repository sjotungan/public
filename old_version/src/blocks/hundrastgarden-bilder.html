title: Så ser hundrastgården ut

<p>
  Rastgården är ett stycke skogsmark inhägnat med grönt nätstängsel, med en
  grind in. Innanför är det tallar och granar, barrmark och berg i dagen –
  ingen anlagd gräsmatta. Klicka på en bild för att se den i full storlek och
  bläddra vidare bland de andra.
</p>
