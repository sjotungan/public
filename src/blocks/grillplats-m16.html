<!--
title: Grillplatsen vid Myggdalsvägen 16
-->

<p>
  Grillplatsen ligger på en stensatt yta mitt på gården, med en rund grill
  på fot, bänkar och ett bänkbord åt ena hållet och en pergola med bänkar
  under åt det andra. En stor gammal en står bakom, och en lekplats ligger
  en bit bort på samma gård.
  <a href="https://www.google.com/maps/search/?api=1&amp;query=59.243267,18.233162">Visa på karta</a>.
</p>
