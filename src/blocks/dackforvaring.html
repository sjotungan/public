<!--
title: Däckförvaring
-->

<!-- "Utan kostnad" står utskrivet här men inte på raden i det-har-ingar, och det
     är med flit: där betyder en rad utan kostnad redan att den ingår, eftersom
     ingressen säger det. Den regeln gäller bara inuti det blocket – på en
     rollsida betyder tystnad ingenting, och däckförvaring är dessutom det de
     flesta föreningar tar betalt för. Då är det värt en tydlig mening. -->

<!-- SKRIV INTE UT VILKET GARAGE DET ÄR. Garaget pekades ut med bokstav här och
     på raden i det-har-ingar, och togs bort med flit.

     Skälet är vem uppgiften är till nytta för. För sajtens läsare – en spekulant
     och hans mäklare – är den värdelös: de har inga däck stående i föreningens
     garage, och hela poängen är att förvaringen finns och är gratis. För den som
     bor här är den svagt användbar och står redan i anslaget i porten, som
     meningen nedan pekar på. Kvar blir en enda läsare som har konkret nytta av
     en adress till ett olarmat utrymme fullt av däck, och honom skriver vi inte
     för.

     Invändningen "A–Ö på sjotungan.se skriver ju ut garaget ändå" (kontrollerat
     2026-08-17) ändrar inget i det: att uppgiften finns någon annanstans gör den
     inte nyttigare här. Att få den bort från den officiella sajten är
     styrelsens beslut, inte vårt.

     Bokstaven hör inte hemma i den här kommentaren heller: kommentarerna följer
     med ut i den byggda sidan och går att läsa i källkoden. -->

<p>
  Du kan säsongsförvara däck utan kostnad, så sommar- och vinterdäcken inte
  behöver ta plats i lägenhetsförrådet mellan säsongerna. Navkapslar och
  däcksidor förvarar du själv. Var förvaringen finns och när den är öppen
  vår och höst står i anslaget i porten.
</p>
