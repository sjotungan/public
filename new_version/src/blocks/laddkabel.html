<!--
title: Uttag och laddkabel
-->

<p>
  Laddboxarna har uttag av <strong>typ 2</strong> (Mennekes, formellt
  IEC 62196-2) – standarden för växelströmsladdning i Sverige och
  övriga Europa. Boxen har ett uttag med lock och ingen fast kabel, så
  du använder din egen laddkabel med typ 2-kontakt mot laddboxen.
</p>
