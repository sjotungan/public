<!-- SKRIV INTE UT VILKET GARAGE DET ÄR. Garaget pekades ut med bokstav här och

     Skälet är vem uppgiften är till nytta för. För sajtens läsare – en spekulant

     Invändningen "A–Ö på sjotungan.se skriver ju ut garaget ändå" (kontrollerat

     Bokstaven hör inte hemma i den här kommentaren heller: kommentarerna följer

<p>
  Du kan säsongsförvara däck utan kostnad, så sommar- och vinterdäcken inte
  behöver ta plats i lägenhetsförrådet mellan säsongerna. Navkapslar och
  däcksidor förvarar du själv. Var förvaringen finns och när den är öppen
  vår och höst står i anslaget i porten.
</p>
